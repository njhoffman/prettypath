# lint, format check and the busted suite on every push and pull request, under lua 5.1 and luajit
# (the interpreters `make install` picks between). zsh and fish are installed so the completion specs run.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # luajit runs on the lua 5.1 tree, as on a machine with `make install`: luarocks itself cannot run
        # under luajit (the luarocks.org manifest is over luajit's 65536 constants per function)
        target: [test, test-luajit]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: luajit, and shells for the completion specs
        run: sudo apt-get update && sudo apt-get install -y luajit zsh fish
      - name: dependencies
        run: |
          luarocks install luv
          luarocks install lua-filesize
          luarocks install busted
          luarocks install luacheck
      - name: lint
        run: make lint
      - name: ${{ matrix.target }}
        # the specs start the CLI with $LUA (test-luajit sets it); the luarocks tree is the action's
        run: make ${{ matrix.target }} LUAROCKS=luarocks

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --respect-ignores --check bin prettypath.lua prettypath spec
